name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Smoke test ohr-core and the CLI
        run: |
          socket="$RUNNER_TEMP/core.sock"
          node packages/core/dist/daemon/main.js --socket "$socket" --database "$RUNNER_TEMP/ohr.db" --group "" &
          core=$!
          for _ in $(seq 50); do [ -S "$socket" ] && break; sleep 0.2; done
          node packages/cli/dist/bin.js version
          node packages/cli/dist/bin.js plan --redundancy shr1 --sizes 4TB,8TB,8TB
          node packages/cli/dist/bin.js --socket "$socket" status
          node packages/cli/dist/bin.js --socket "$socket" job list
          kill "$core"

  integration:
    name: Integration tests on loop devices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends gdisk mdadm lvm2 btrfs-progs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: sudo env "PATH=$PATH" pnpm --filter @ohr/core test:integration
