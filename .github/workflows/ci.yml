name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Smoke test the CLI
        run: |
          node packages/cli/dist/bin.js version
          node packages/cli/dist/bin.js plan --redundancy shr1 --sizes 4TB,8TB,8TB
          node packages/cli/dist/bin.js status

  integration:
    name: Integration tests on loop devices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends gdisk mdadm lvm2 btrfs-progs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: sudo env "PATH=$PATH" pnpm --filter @ohr/core test:integration
