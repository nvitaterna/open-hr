name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs every job here before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Check the shell scripts
        # Each finding becomes an annotation on its file and line.
        run: |
          set -o pipefail
          shellcheck --version | sed -n 2p
          shellcheck --severity=warning --format=gcc scripts/*.sh deploy/*.sh \
            deploy/debian/postinst deploy/debian/prerm deploy/debian/postrm \
            deploy/debian/ohr deploy/debian/ohr-web |
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): [a-z]+: (.*)$/::error file=\1,line=\2,col=\3::\4/'
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Smoke test ohr-core and the CLI
        run: |
          socket="$RUNNER_TEMP/core.sock"
          node packages/core/dist/daemon/main.js --socket "$socket" --database "$RUNNER_TEMP/ohr.db" --group "" &
          core=$!
          for _ in $(seq 50); do [ -S "$socket" ] && break; sleep 0.2; done
          node packages/cli/dist/bin.js version
          node packages/cli/dist/bin.js plan --redundancy shr1 --sizes 4TB,8TB,8TB
          node packages/cli/dist/bin.js --socket "$socket" status
          node packages/cli/dist/bin.js --socket "$socket" job list
          kill "$core"

  lsblk:
    name: lsblk columns on Debian ${{ matrix.debian }}
    runs-on: ubuntu-latest
    # Core's one fatal command must work with each supported release's util-linux (decision 0009).
    container: debian:${{ matrix.debian }}
    strategy:
      matrix:
        debian: ["12", "13"]
    steps:
      - uses: actions/checkout@v7
      - name: Run lsblk with the columns core asks for
        run: scripts/check-lsblk-columns.sh

  integration:
    name: Integration tests on loop devices
    runs-on: ubuntu-latest
    # A kernel hang in md leaves processes in uninterruptible sleep, which no
    # test timeout can stop. Fail fast instead of holding a runner for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends gdisk mdadm lvm2 btrfs-progs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # GITHUB_ACTIONS through sudo, so vitest reports failures as annotations.
      - run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true pnpm --filter @ohr/core test:integration
      - name: Show the kernel and md messages after a failure
        if: failure()
        run: |
          echo "::notice::$(uname -r), $(. /etc/os-release && echo "$PRETTY_NAME"), mdadm $(mdadm --version 2>&1)"
          echo "::notice::$(sudo dmesg | grep -E 'md[0-9]+|md/raid' | tail -40 | tr '\n' '|')"

  package:
    name: Package, install, and remove
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install nfpm
        run: deploy/install-nfpm.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - name: Install the package
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends ./deploy/out/open-hr_*.deb
      - name: Smoke test the installed package
        run: sudo --preserve-env=GITHUB_ACTIONS deploy/smoke-test.sh
      - name: Reinstall keeps the token and the certificate
        run: |
          token=$(sudo cat /var/lib/ohr/web/setup-token)
          cert=$(sudo sha256sum /etc/ohr/tls/cert.pem)
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends --reinstall ./deploy/out/open-hr_*.deb
          [ "$(sudo cat /var/lib/ohr/web/setup-token)" = "$token" ]
          [ "$(sudo sha256sum /etc/ohr/tls/cert.pem)" = "$cert" ]
          sudo --preserve-env=GITHUB_ACTIONS deploy/smoke-test.sh
      - name: Remove keeps the data, purge removes it
        run: |
          sudo apt-get remove --yes open-hr
          if systemctl is-active --quiet ohr-core.service; then exit 1; fi
          sudo test -f /var/lib/ohr/web/setup-token
          sudo apt-get purge --yes open-hr
          test ! -e /etc/ohr
          test ! -e /var/lib/ohr
