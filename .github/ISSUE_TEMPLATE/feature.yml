name: Feature request
description: Suggest something new.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Open HR does not help with today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine it working.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I have read the non-goals in docs/PLAN.md section 2.
          required: true
